<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Генератор фона из Material-иконок">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@500&display=swap"
      rel="stylesheet"
    >
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    >
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    >
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="./src/generator.css">
    <title>Генератор фона</title>
  </head>
  <body>
    <!-- Экран загрузки и инициализации -->
    <div id="generator-loader" class="generator-loader">
      <div class="loader-content">
        <div class="loader-spinner"></div>
        <p class="loader-title">Загрузка генератора</p>
      </div>
    </div>

    <main class="generator-page">
      <header class="generator-header">
        <a class="generator-header__back" href="./">
          <span class="back-key">[ESC]</span>
          <span class="back-text">НА ГЛАВНУЮ</span>
        </a>
      </header>

      <div class="generator-title-wrap">
        <h1 class="generator-title"><span class="title-accent">//</span> Генератор</h1>
      </div>

      <div class="generator-layout">
        <form id="bg-generator-form" class="generator-form">

          <section class="settings-group">
            <h2>Размер, угол и плотность</h2>
            <div class="settings-grid">
              <label>
                <span>Размер иконок</span>
                <input type="number" id="bg-cell" min="12" max="96" step="1" value="28">
              </label>
              <label>
                <span>Угол поворота сетки</span>
                <input type="number" id="bg-angle" min="-90" max="90" step="1" value="0">
              </label>
              <label class="full-width">
                <div class="range-header">
                  <span>Плотность сетки</span>
                  <span id="bg-density-val" class="range-value">1.30x</span>
                </div>
                <input type="range" id="bg-density" min="0.5" max="2.5" step="0.05" value="1.3">
              </label>
            </div>
          </section>

          <section class="settings-group">
            <h2>Расположение и вариативность</h2>
            <div class="settings-grid">
              <label>
                <span>Режим расположения</span>
                <select id="bg-layout">
                  <option value="grid" selected>Сетка (Grid)</option>
                  <option value="stagger">Сдвиг через ряд (Stagger)</option>
                  <option value="scatter">Хаос / Разброс (Scatter)</option>
                  <option value="hex">Соты (Hexagonal)</option>
                  <option value="spiral">Спираль (Spiral)</option>
                </select>
              </label>
              <label id="stagger-axis-label">
                <span>Направление сдвига</span>
                <select id="bg-stagger-axis">
                  <option value="row" selected>По рядам (вертикально)</option>
                  <option value="col">По колонкам (горизонтально)</option>
                </select>
              </label>
              <label class="full-width">
                <div class="range-header">
                  <span>Случайный поворот иконок</span>
                  <span id="bg-random-rotate-val" class="range-value">0°</span>
                </div>
                <input type="range" id="bg-random-rotate" min="0" max="180" step="5" value="0">
              </label>
              <label class="full-width">
                <div class="range-header">
                  <span>Разброс размера иконок</span>
                  <span id="bg-random-scale-val" class="range-value">0.0</span>
                </div>
                <input type="range" id="bg-random-scale" min="0" max="0.8" step="0.05" value="0">
              </label>
            </div>
          </section>

          <section class="settings-group">
            <h2>Габариты холста</h2>
            <div class="settings-grid">
              <label>
                <span>Ширина (px)</span>
                <input type="number" id="bg-width" min="512" max="5000" step="1" value="2000">
              </label>
              <label>
                <span>Высота (px)</span>
                <input type="number" id="bg-height" min="512" max="5000" step="1" value="2000">
              </label>
            </div>
          </section>

          <section class="settings-group">
            <h2>Цвета и эффекты</h2>
            <div class="settings-grid">
              <label>
                <span>Тип фона</span>
                <select id="bg-color-mode">
                  <option value="solid" selected>Однотонный</option>
                  <option value="gradient">Градиент</option>
                </select>
              </label>
              <label>
                <span>Цвет фона 1 (HEX)</span>
                <div class="color-input">
                  <div class="color-swatch" id="bg-swatch"></div>
                  <input type="text" id="bg-color" value="#000000" maxlength="9" spellcheck="false">
                </div>
              </label>
              <label id="bg-color-2-label">
                <span>Цвет фона 2 (HEX)</span>
                <div class="color-input">
                  <div class="color-swatch" id="bg2-swatch"></div>
                  <input type="text" id="bg-color-2" value="#1a1a2e" maxlength="9" spellcheck="false">
                </div>
              </label>
              <label id="bg-grad-angle-label">
                <span>Угол градиента фона (градусы)</span>
                <input type="number" id="bg-grad-angle" min="-180" max="180" step="5" value="45">
              </label>
              <label id="bg-grad-freq-label" class="full-width">
                <div class="range-header">
                  <span>Повторы градиента (Частота)</span>
                  <span id="bg-grad-freq-val" class="range-value">1.0x</span>
                </div>
                <input type="range" id="bg-grad-freq" min="0.5" max="10" step="0.5" value="1.0">
              </label>

              <label class="full-width">
                <span>Окраска иконок</span>
                <select id="fg-color-mode">
                  <option value="solid" selected>Однотонная</option>
                  <option value="gradient">Градиент по холсту</option>
                  <option value="palette">Разноцветные (Палитра)</option>
                </select>
              </label>
              <label>
                <span>Цвет иконок 1 (HEX)</span>
                <div class="color-input">
                  <div class="color-swatch" id="fg-swatch"></div>
                  <input type="text" id="fg-color" value="#ffffff4d" maxlength="9" spellcheck="false">
                </div>
              </label>
              <label id="fg-color-2-label">
                <span>Цвет иконок 2 (HEX)</span>
                <div class="color-input">
                  <div class="color-swatch" id="fg2-swatch"></div>
                  <input type="text" id="fg-color-2" value="#cedb1a4d" maxlength="9" spellcheck="false">
                </div>
              </label>
              <label id="fg-grad-angle-label">
                <span>Угол градиента иконок (градусы)</span>
                <input type="number" id="fg-grad-angle" min="-180" max="180" step="5" value="45">
              </label>
            </div>
          </section>

          <section class="settings-group settings-group--seed">
            <h2>Seed</h2>
            <label>
              <span>Случайное зерно (опционально)</span>
              <input type="number" id="bg-seed" min="1" step="1" placeholder="случайно при каждой генерации">
            </label>
          </section>
        </form>

        <aside class="tools-panel">
          <section class="preview-box">
            <div class="preview-header">
              <p>Превью</p>
              <span id="preview-res-badge" class="preview-badge">2000×2000</span>
            </div>
            <div class="preview-viewport">
              <canvas id="bg-preview" width="150" height="150"></canvas>
            </div>
          </section>
          <div class="panel-actions">
            <a href="#" id="download-bg-jpeg" class="generate-btn">Сгенерировать и скачать</a>
            <button type="button" id="reset-form-btn" class="reset-btn">Сбросить настройки</button>
          </div>
        </aside>
      </div>

      <!-- Плавающий колорпикер -->
      <section class="picker-box hidden" id="picker-box">
        <div class="picker-header">
          <p>Колорпикер</p>
          <button type="button" id="close-picker-btn" aria-label="Закрыть">&times;</button>
        </div>
        <div class="picker-area">
          <canvas id="picker-sv" width="180" height="160"></canvas>
          <canvas id="picker-hue-strip" width="22" height="160"></canvas>
          <canvas id="picker-alpha-strip" width="22" height="160"></canvas>
        </div>
        <div class="picker-actions">
          <button type="button" id="random-color-btn">Случайный</button>
          <label class="extractor-upload">
            <span>Экстрактор</span>
            <input type="file" id="palette-image" accept="image/*">
          </label>
        </div>
        <div id="extracted-palette" class="extracted-palette"></div>
      </section>
    </main>
    <script type="module" src="./src/generator.js"></script>
  </body>
</html>
